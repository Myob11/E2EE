global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'services'
    metrics_path: /metrics
    static_configs:
      - targets: ['api_gateway:8000','auth_service:8001','chat_service:8002','message_service:8003','media_service:8004']
