server {
    listen 80;
    server_name secra.top www.secra.top localhost 127.0.0.1;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $api_gateway http://e2ee_api_gateway:8000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client max body size for media uploads (100MB)
    client_max_body_size 100M;

    # WebSocket endpoint for realtime chat push
    location /ws/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep websocket connections open longer
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # API Gateway - proxy to FastAPI service
    location / {
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass $api_gateway/health;
        access_log off;
    }
}

server {
    listen 80;
    server_name logging.secra.top;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $grafana http://e2ee_grafana:3000;

    location = / {
        return 302 /d/e2ee-observability/e2ee-operations;
    }

    location / {
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

