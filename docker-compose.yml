services:
  # =====================
  # NGINX Reverse Proxy
  # =====================
  nginx:
    image: nginx:alpine
    container_name: e2ee_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/api_gateway/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api_gateway
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # API Gateway (FastAPI)
  # =====================
  api_gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    container_name: e2ee_api_gateway
    ports:
      - "8000:8000"
    environment:
      - "AUTH_SERVICE_URL=http://e2ee_auth_service:8001"
      - "CHAT_SERVICE_URL=http://e2ee_chat_service:8002"
      - "MESSAGE_SERVICE_URL=http://e2ee_message_service:8003"
      - "MEDIA_SERVICE_URL=http://e2ee_media_service:8004"
      - DOMAIN=secra.top
      - "SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY not set}"
    depends_on:
      - auth_service
      - chat_service
      - message_service
      - media_service
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # Auth Service
  # =====================
  auth_service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: e2ee_auth_service
    ports:
      - "8001:8001"
    environment:
      - "DATABASE_URL=postgresql://demo:demo@postgres:5432/auth_db"
      - "SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY not set}"
    depends_on:
      - postgres
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # Chat Service
  # =====================
  chat_service:
    build:
      context: ./services/chat_service
      dockerfile: Dockerfile
    container_name: e2ee_chat_service
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=messages_db
      - MONGO_USER=${MONGO_USER:-admin}
      - "MONGO_PASSWORD=${MONGO_PASSWORD:?Error: MONGO_PASSWORD not set}"
      - "SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY not set}"
    depends_on:
      - mongodb
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # Message Service
  # =====================
  message_service:
    build:
      context: ./services/message_service
      dockerfile: Dockerfile
    container_name: e2ee_message_service
    ports:
      - "8003:8003"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=messages_db
      - MONGO_USER=${MONGO_USER:-admin}
      - "MONGO_PASSWORD=${MONGO_PASSWORD:?Error: MONGO_PASSWORD not set}"
      - "CHAT_SERVICE_URL=http://chat_service:8002"
      - "SECRET_KEY=${SECRET_KEY:?Error: SECRET_KEY not set}"
    depends_on:
      - mongodb
      - chat_service
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # Media Service
  # =====================
  media_service:
    build:
      context: ./services/media_service
      dockerfile: Dockerfile
    container_name: e2ee_media_service
    ports:
      - "8004:8004"
    environment:
      - MINIO_ENDPOINT=212.235.185.13:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - MINIO_BUCKET=user-01
      - MINIO_SECURE=false
      - DOMAIN=secra.top
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # Databases
  # =====================
  postgres:
    image: postgres:15-alpine
    container_name: e2ee_postgres
    environment:
      - "POSTGRES_USER=${POSTGRES_USER:-postgres}"
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - e2ee_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis removed: using MongoDB as persistent store and HTTP events for pub/sub

  mongodb:
    image: mongo:7
    container_name: e2ee_mongodb
    environment:
      - MONGO_INITDB_DATABASE=messages_db
      - "MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}"
      - "MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?Error: MONGO_PASSWORD not set}"
    volumes:
      - mongodb_data:/data/db
    networks:
      - e2ee_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: e2ee_minio
    command: server /data --console-address ":9001"
    environment:
      - "MINIO_ROOT_USER=${MINIO_USER:?Error: MINIO_USER not set}"
      - "MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?Error: MINIO_PASSWORD not set}"
    volumes:
      - minio_data:/data
    networks:
      - e2ee_network
    restart: unless-stopped

  # =====================
  # Monitoring & Logging
  # =====================
  prometheus:
    image: prom/prometheus:latest
    container_name: e2ee_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - e2ee_network
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: e2ee_node_exporter
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - e2ee_network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/google-containers/cadvisor:latest
    container_name: e2ee_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - e2ee_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:9.5.0
    container_name: e2ee_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=logging.secra.top
      - GF_SERVER_ROOT_URL=http://logging.secra.top/
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/observability.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - e2ee_network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    container_name: e2ee_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - e2ee_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.8.2
    container_name: e2ee_promtail
    user: root
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - e2ee_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: e2ee_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - e2ee_network
    restart: unless-stopped

networks:
  e2ee_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data: